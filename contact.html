<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urban Style | Contact Us</title>

    <meta name="description" content="Contact Urban Style for questions about our clothing, orders, sizes and products.">

    <meta name="keywords" content="Contact Urban Style, clothing enquiries, urban fashion">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>URBAN STYLE</h1>
    <p>Contact Us</p>
</header>

<nav aria-label="Main navigation">
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="content">

    <h2>Get In Touch</h2>

    <p>If you have any questions about our products, contact us.</p>

    <form id="contactForm" onsubmit="submitContact(event)">

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email address" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message"
                  rows="5" placeholder="Write your message"
                  required></textarea>

        <button type="submit">Send Message</button>

    </form>

    <p id="contact-response" role="status"></p>

</main>

<footer>
    <p>&copy; 2026 Urban Style. All rights reserved.</p>
</footer>

<script src="js/script.js"></script>

</body>
</html>
